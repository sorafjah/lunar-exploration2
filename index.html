  #toast{position:fixed;left:50%;top:20%;transform:translateX(-50%);background:rgba(0,0,0,.72);
    border:2px solid #ffd54a;border-radius:16px;padding:10px 22px;font-size:24px;font-weight:700;
    line-height:1.8;text-align:center;display:none;pointer-events:none;white-space:nowrap;}

  .overlay{position:fixed;inset:0;background:rgba(4,8,24,.93);display:none;align-items:center;justify-content:center;z-index:10;}

  .panel{width:min(94vw,900px);max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 24px;box-sizing:border-box;line-height:1.8;}
  .panel h1{margin:0 0 6px;font-size:32px;text-align:center;color:#ffd54a;}
  .panel h2{margin:10px 0 6px;font-size:21px;border-left:6px solid #ffd54a;padding-left:8px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
  .card{background:rgba(255,255,255,.08);border-radius:14px;padding:8px;text-align:center;font-size:15px;line-height:1.7;}
  .card svg{width:50px;height:50px;display:block;margin:0 auto 4px;}
  .mlist{font-size:18px;margin:0;padding-left:1.4em;}
  .note{font-size:16px;background:rgba(93,255,166,.12);border:1px solid #5dffa6;border-radius:10px;padding:6px 12px;margin-top:8px;}
  .bigBtn{display:block;margin:14px auto 4px;min-width:220px;min-height:64px;font-size:26px;font-weight:700;
    border:none;border-radius:32px;background:#ffd54a;color:#222;box-shadow:0 4px 12px rgba(0,0,0,.5);}
  table.res{width:100%;border-collapse:collapse;font-size:19px;margin-top:6px;}
  table.res th,table.res td{border:1px solid rgba(255,255,255,.35);padding:6px 8px;text-align:center;}

<script type="module">
import * as THREE from 'three';

/* =========================================================
   iPad対策：ダブルタップ・ピンチ・スクロールを止める
   ========================================================= */
document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) { e.preventDefault(); return; }
  if (e.target.closest && e.target.closest('.scroll')) return;
  e.preventDefault();
}, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault());

/* =========================================================
   ふりがな
   ========================================================= */
const FURI = {
  '地球':'ちきゅう','月面':'げつめん','月':'つき','空中':'くうちゅう','空気':'くうき',
  '時間':'じかん','高':'たか','秒':'びょう','基地':'きち','石':'いし','岩':'いわ',
  '重力':'じゅうりょく','倍':'ばい','音':'おと','無線':'むせん','光':'ひか','回':'かい',
  '分':'ふん','体':'からだ','落':'お','探索':'たんさく','探査機':'たんさき','管制室':'かんせいしつ'
};
const furiRe = new RegExp(Object.keys(FURI).sort((a,b)=>b.length-a.length).join('|'), 'g');
const furi = s => s.replace(furiRe, m => `<ruby>${m}<rt>${FURI[m]}</rt></ruby>`);
const fmt = v => v < 1 ? (Math.round(v*10)/10).toFixed(1) : String(Math.round(v));

/* =========================================================
   定数（調整しやすいようにここにまとめる）
   ========================================================= */
const TIME_LIMIT = 120;                 // 制限時間（秒）
const G = { earth: 9.8, moon: 1.62 };
const V0 = Math.sqrt(2 * 9.8 * 0.5);   // 地球で約0.5m跳べる初速（月では約3m）
const WALK = { earth: 3.6, moon: 2.2 };  // 移動の速さ m/s（地球は小走り、月はもっさり歩き）
const PR = 0.35;                        // プレイヤーの半径
const AREA = 68;                        // 歩ける範囲（±）
const TURN = { ground: 7, air: 0.35 };  // 向きを変える速さ（空中では体を少しひねれるだけ）

/* =========================================================
   状態
   ========================================================= */
const S = {
  mode: 'moon', mission: 1, paused: true, started: false, frames: 0, renderFrames: 0, elapsed: 0,
  timeLeft: TIME_LIMIT, warned: false, result: null,
  rec: { jump: { earth: null, moon: null }, stones: 0, falls: 0, clearTime: null },
  said: {}, runId: 0, sameModeJumps: 0
};
const player = { x:0, y:0, z:3, vx:0, vz:0, vy:0, grounded:true, facing:Math.PI,
  jump:null, phase:0, stride:0, moveAmt:0,
  state:'normal', st:0, tilt:0, tiltV:0, cool:0 };
const input = { jx:0, jy:0, keys:{}, jumpQueued:false };
let timers = [];
const later = (sec, fn) => { timers.push({ t: S.elapsed + sec, fn, id: S.runId }); };

/* =========================================================
   Three.js 基本
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 1200);
const cam = { yaw: 0, pitch: 0.32, dist: 7.5, target: new THREE.Vector3(0,1.2,3) };
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x5a7a3a, 1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-30, right:30, top:30, bottom:-30, near:1, far:140 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);
const SUN_DIR = { earth: new THREE.Vector3(0.5,0.8,0.3).normalize(), moon: new THREE.Vector3(-0.8,0.33,0.25).normalize() };

/* =========================================================
   地形：岩（当たり判定つき）・基地・クレーター（へこみ）
   ========================================================= */
const colliders = [
  { x:-9,  z:-10, r:1.6, h:2.2 },
  { x:11,  z:-14, r:1.5, h:2.3 },
  { x:4,   z:-6,  r:1.0, h:0.5 },
  { x:-6,  z:3,   r:1.2, h:0.9 },
  { x:15,  z:2,   r:2.0, h:1.4 },
  { x:-16, z:-3,  r:1.8, h:1.1 },
  { x:1,   z:-24, r:2.5, h:1.6 },
  { x:-20, z:-18, r:2.2, h:1.8 },
  { x:22,  z:-26, r:1.7, h:2.2 },
  { x:-26, z:10,  r:1.6, h:2.1 },
];
const BASE = { x:0, z:9 };
colliders.push({ x:BASE.x, z:BASE.z+1, r:1.5, h:3.4, base:true });

// クレーター：お椀型にへこみ、ふちが少しもり上がる
const craters = [];
{
  const ok = (x,z,R) => {
    if (Math.hypot(x, z-3) < R*1.5 + 6) return false;
    if (Math.hypot(x-BASE.x, z-BASE.z) < R*1.5 + 5) return false;
    if (colliders.some(c => Math.hypot(x-c.x, z-c.z) < c.r + R*1.5 + 1)) return false;
    if (craters.some(k => Math.hypot(x-k.x, z-k.z) < (k.R + R)*1.5)) return false;
    return true;
  };
  for (let i=0; i<3000 && craters.length<18; i++){
    const R = 3 + Math.random()*5;
    const x = (Math.random()-.5)*2*(AREA-R*1.5), z = (Math.random()-.5)*2*(AREA-R*1.5);
    if (ok(x,z,R)) craters.push({ x, z, R, D: R*0.26, rim: R*0.07 });
  }
}
function craterH(x, z){
  let h = 0;
  for (const k of craters){
    const d = Math.hypot(x-k.x, z-k.z);
    if (d < k.R){ const u = d/k.R; h += -k.D + (k.D + k.rim)*u*u; }
    else if (d < k.R*1.5){ const u = 1 - (d - k.R)/(k.R*0.5); h += k.rim*u*u; }
  }
  return h;
}
// 丘：なだらかなもり上がり（月の高地のイメージ）
const hills = [];
{
  for (let i=0; i<3000 && hills.length<6; i++){
    const W = 9 + Math.random()*8, H = 2 + Math.random()*2.5;
    const x = (Math.random()-.5)*2*(AREA-5), z = (Math.random()-.5)*2*(AREA-5);
    if (Math.hypot(x, z-3) < W*2 + 6 || Math.hypot(x-BASE.x, z-BASE.z) < W*2 + 6) continue;
    if (colliders.some(c => Math.hypot(x-c.x, z-c.z) < c.r + W*2)) continue;
    if (craters.some(k => Math.hypot(x-k.x, z-k.z) < k.R*1.5 + W*1.6)) continue;
    if (hills.some(h => Math.hypot(x-h.x, z-h.z) < (h.W + W)*1.8)) continue;
    hills.push({ x, z, W, H });
  }
}
function hillH(x, z){
  let h = 0;
  for (const k of hills){ const d2 = ((x-k.x)**2 + (z-k.z)**2) / (k.W*k.W); if (d2 < 9) h += k.H * Math.exp(-d2); }
  return h;
}
const terrainH = (x, z) => craterH(x, z) + hillH(x, z);
const groundH = (x, z) => S.mode === 'moon' ? terrainH(x, z) : 0;
function slopeAt(x, z){
  const e = 0.25;
  const dx = (groundH(x+e,z) - groundH(x-e,z)) / (2*e), dz = (groundH(x,z+e) - groundH(x,z-e)) / (2*e);
  return { dx, dz, m: Math.hypot(dx, dz) };
}
const insideCrater = (x, z, f=1.3) => craters.some(k => Math.hypot(x-k.x, z-k.z) < k.R*f);

/* テクスチャ：地面はやわらかいムラだけにして、足あとと区別しやすくする */
function groundTex(r,g,b,amt,blobs){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  const img = x.createImageData(256,256);
  for (let i=0;i<256*256;i++){
    const n = (Math.random()-.5)*amt;
    img.data[i*4]=r+n; img.data[i*4+1]=g+n; img.data[i*4+2]=b+n; img.data[i*4+3]=255;
  }
  x.putImageData(img,0,0);
  for (let i=0;i<blobs;i++){
    const px=Math.random()*256, py=Math.random()*256, pr=15+Math.random()*40;
    const light = Math.random() < .5;
    const gr = x.createRadialGradient(px,py,0,px,py,pr);
    gr.addColorStop(0, light ? 'rgba(255,255,255,.07)' : 'rgba(0,0,0,.06)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gr; x.fillRect(px-pr,py-pr,pr*2,pr*2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
function globeTex(){
  const c=document.createElement('canvas'); c.width=512; c.height=256;
  const x=c.getContext('2d');
  x.fillStyle='#1f5fbf'; x.fillRect(0,0,512,256);
  for(let i=0;i<14;i++){ x.fillStyle=i%3?'#3f9a45':'#b59b5c';
    x.beginPath(); x.ellipse(Math.random()*512,40+Math.random()*176,20+Math.random()*50,12+Math.random()*30,Math.random()*3,0,Math.PI*2); x.fill(); }
  x.fillStyle='rgba(255,255,255,.8)';
  for(let i=0;i<30;i++){ x.beginPath(); x.ellipse(Math.random()*512,Math.random()*256,15+Math.random()*40,4+Math.random()*6,Math.random(),0,Math.PI*2); x.fill(); }
  x.fillStyle='#fff'; x.fillRect(0,0,512,14); x.fillRect(0,242,512,14);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

const earthEnv = new THREE.Group(), moonEnv = new THREE.Group();
scene.add(earthEnv, moonEnv);

/* 地球の地面（平ら） */
{
  const t = groundTex(80,150,60,24,20); t.repeat.set(90,90);
  const g = new THREE.Mesh(new THREE.PlaneGeometry(600,600), new THREE.MeshStandardMaterial({ map:t, roughness:1 }));
  g.rotation.x = -Math.PI/2; g.receiveShadow = true; earthEnv.add(g);
}
/* 月の地面（クレーターでへこむ） */
{
  const SIZE = (AREA+7)*2, SEG = 300;
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  geo.rotateX(-Math.PI/2);
  const p = geo.attributes.position, col = [];
  for (let i=0;i<p.count;i++){
    const x = p.getX(i), z = p.getZ(i), h = terrainH(x, z);
    p.setY(i, h);
    const k = h < 0 ? 0.78 + 0.22*(1 + h/2.2) : 1;   // くぼみは少し暗く
    col.push(k, k, k);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const t = groundTex(150,150,147,16,40); t.repeat.set(SIZE/7, SIZE/7);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map:t, roughness:1, vertexColors:true }));
  m.receiveShadow = true; moonEnv.add(m);
  // 外側の平らな地面（中央に穴）
  const sh = new THREE.Shape(); sh.moveTo(-300,-300); sh.lineTo(300,-300); sh.lineTo(300,300); sh.lineTo(-300,300);
  const hole = new THREE.Path(); const H = SIZE/2 - 0.3;
  hole.moveTo(-H,-H); hole.lineTo(-H,H); hole.lineTo(H,H); hole.lineTo(H,-H); sh.holes.push(hole);
  const og = new THREE.ShapeGeometry(sh); og.rotateX(-Math.PI/2);
  const t2 = t.clone(); t2.repeat.set(1/7, 1/7); t2.needsUpdate = true;
  const o = new THREE.Mesh(og, new THREE.MeshStandardMaterial({ map:t2, roughness:1 }));
  o.receiveShadow = true; moonEnv.add(o);
}

/* 岩 */
const rockMat = {
  earth: new THREE.MeshStandardMaterial({ color:0x8a7a66, roughness:1, flatShading:true }),
  moon:  new THREE.MeshStandardMaterial({ color:0x8f8f8f, roughness:1, flatShading:true })
};
const rockMeshes = [];
for (const c of colliders){
  if (c.base) continue;
  // 丸みのある大岩（上は少し平らで、乗ることができる）
  const geo = new THREE.IcosahedronGeometry(1, 2);
  const p = geo.attributes.position, jit = new Map();
  for (let i=0;i<p.count;i++){
    const x0 = p.getX(i), y0 = p.getY(i), z0 = p.getZ(i);
    const key = `${x0.toFixed(3)},${y0.toFixed(3)},${z0.toFixed(3)}`;
    if (!jit.has(key)) jit.set(key, 0.9 + Math.random()*0.2);
    const j = jit.get(key);
    p.setXYZ(i, x0*c.r*1.08*j, Math.min(c.h, (y0+1)/2 * c.h * 1.25), z0*c.r*1.08*j);
  }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, rockMat.moon);
  m.position.set(c.x, -0.05, c.z); m.castShadow = m.receiveShadow = true;
  scene.add(m); rockMeshes.push(m);
}

/* つまずく石（小さな岩） */
const tripRocks = [];
{
  const geo = new THREE.DodecahedronGeometry(1, 0);
  for (let i=0; i<4000 && tripRocks.length<55; i++){
    const x = (Math.random()-.5)*2*(AREA-2), z = (Math.random()-.5)*2*(AREA-2), r = 0.22 + Math.random()*0.18;
    if (Math.hypot(x, z-3) < 5 || Math.hypot(x-BASE.x, z-BASE.z) < 6) continue;
    if (insideCrater(x, z, 1.55) || hillH(x, z) > 0.02) continue;
    if (colliders.some(c => Math.hypot(x-c.x, z-c.z) < c.r + 2)) continue;
    if (tripRocks.some(t => Math.hypot(x-t.x, z-t.z) < 4)) continue;
    const m = new THREE.Mesh(geo, rockMat.moon);
    m.scale.set(r, r*0.6, r*1.1); m.rotation.set(Math.random(), Math.random()*6, Math.random());
    m.position.set(x, r*0.3, z); m.castShadow = true; m.receiveShadow = true;
    scene.add(m); rockMeshes.push(m);
    tripRocks.push({ x, z, r });
  }
}

/* 基地 */
/* 着陸した探査機 */
{

function pickStoneSpots(){
  const far = (x,z) => Math.hypot(x, z-3) > 10 && Math.hypot(x-BASE.x, z-BASE.z) > 8;
  const cr = craters.filter(k => far(k.x, k.z) && Math.hypot(k.x, k.z) < 50);
  const k = cr[Math.floor(Math.random()*cr.length)];
  const a = Math.random()*Math.PI*2, d = Math.random()*k.R*0.45;
  const s1 = { kind:'crater', x:k.x + Math.cos(a)*d, z:k.z + Math.sin(a)*d };
  let s2 = null;
  for (let i=0; i<2000 && !s2; i++){
    const x = (Math.random()-.5)*90, z = (Math.random()-.5)*90;
    if (!far(x,z) || Math.hypot(x-s1.x, z-s1.z) < 15) continue;
    if (insideCrater(x, z, 1.7) || hillH(x, z) > 0.02) continue;
    if (colliders.some(c => Math.hypot(x-c.x, z-c.z) < c.r + 2)) continue;
    if (tripRocks.some(t => Math.hypot(x-t.x, z-t.z) < 1.5)) continue;
    s2 = { kind:'ground', x, z };
  }
  return Math.random() < .5 ? [s1, s2] : [s2, s1];
}

/* 床の高さ（地面・クレーター・岩の上） */
function floorAt(x, z, refY){
  let f = groundH(x, z);
  for (const c of colliders){
    if (Math.hypot(x-c.x, z-c.z) < c.r && c.h <= refY + 0.06) f = Math.max(f, c.h);
  }
  return f;
}

   ========================================================= */
let actx = null;
function ensureAudio(){
  if (!actx){ const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
  if (actx && actx.state !== 'running') actx.resume();
}
function tone(f, dur, type='sine', vol=.1, delay=0, f2=null){
  if (!actx) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur, vol, freq, type='lowpass', delay=0){
  if (!actx) return;
  const t = actx.currentTime + delay, n = Math.floor(actx.sampleRate*dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate), ch = buf.getChannelData(0);
  for (let i=0;i<n;i++) ch[i] = Math.random()*2-1;
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  src.connect(f).connect(g).connect(actx.destination); src.start(t);
}

   ミッションの進行

const other = m => m === 'moon' ? '地球' : '月';
function onJumpMeasured(h, t, m){
  toast(furi(`${m==='moon'?'🌕 月':'🌍 地球'}　高さ 約${fmt(h)}m ／ 空中 約${fmt(t)}秒`));
  if (S.mission !== 1) return;
  S.rec.jump[m] = { h, t };
  renderMission();
  const r = S.rec.jump;
  if (r.earth && r.moon){
    const ratio = Math.max(1, Math.round(r.moon.h / r.earth.h));
    radio(`すごい！ 月では 地球の 約${ratio}倍 高く とべたね。つぎは ミッション2だ。`, 7);
    S.mission = 1.5;
    later(3, () => {
      S.mission = 2;
      if (S.mode !== 'moon') setMode('moon');
      renderMission(); refreshStones();
      radio('月に もどったよ。光っている 石を 2こ あつめて、探査機に もどろう。1こは クレーターの 中に あるよ。', 9);
    });
  } else {
    radio(`いいね！ つぎは ${other(m)}で とんでみよう。みぎうえの ボタンで きりかえてね。`);
  }
}
function updateStones(){
  if (S.mission !== 2 || S.mode !== 'moon') return;
  const px = player.x, py = player.y + 0.9, pz = player.z;
  for (const s of stones){
    if (s.collected) continue;
    const p = s.g.position;
    if (Math.hypot(px - p.x, py - (p.y + 0.22), pz - p.z) < 1.35){
      s.collected = true; s.g.visible = false; S.rec.stones++;
      sfx.collect(); renderMission();
      if (S.rec.stones >= NSTONE){ baseBeam.visible = true; radio('石を ぜんぶ あつめたね！ みどりの 光の 探査機に もどろう。'); }
      else toast(furi(`石 ${S.rec.stones} / ${NSTONE}`), 2);
    }
  }
  if (S.rec.stones >= NSTONE && player.grounded && Math.hypot(player.x - BASE.x, player.z - BASE.z) < 4.2){
    S.mission = 3; renderMission(); baseBeam.visible = false;
    S.rec.clearTime = TIME_LIMIT - S.timeLeft;
    sfx.clear(); radio('ミッション クリア！ おつかれさま。', 5);
    later(2.2, () => showResult('clear'));
  }
}
function updateTimer(dt){
  if (!S.started || S.mission >= 3) return;
  S.timeLeft -= dt;
  if (S.timeLeft <= 30 && !S.warned){ S.warned = true; radio('のこり 30秒！ いそいで！', 4); }
  if (S.timeLeft <= 0){
    S.timeLeft = 0; S.mission = 3;
    sfx.timeup(); radio('じかん ぎれだ。探査機に もどって きてね。', 4);
    later(1.5, () => showResult('timeup'));
  }
  renderTimer();
}

const joy = $('joy'), knob = $('knob'); let joyId = null;
function joyUpdate(e){
  const r = joy.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
  const R = 55, len = Math.hypot(dx, dy);
  if (len > R){ dx *= R/len; dy *= R/len; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  input.jx = dx/R; input.jy = dy/R;
}
joy.addEventListener('pointerdown', e => { ensureAudio(); joyId = e.pointerId; joy.setPointerCapture(e.pointerId); joyUpdate(e); });
joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyUpdate(e); });
const joyEnd = e => { if (e.pointerId === joyId){ joyId = null; input.jx = input.jy = 0; knob.style.transform = ''; } };
joy.addEventListener('pointerup', joyEnd); joy.addEventListener('pointercancel', joyEnd);
$('jumpBtn').addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); input.jumpQueued = true; });

/* カメラ操作：右になぞると右が見える */
const cv = renderer.domElement; let dragId = null, lastX = 0, lastY = 0;
cv.addEventListener('pointerdown', e => { if (dragId !== null) return; dragId = e.pointerId; lastX = e.clientX; lastY = e.clientY; cv.setPointerCapture(e.pointerId); });

});

cv.addEventListener('pointerup', dragEnd); cv.addEventListener('pointercancel', dragEnd);

/* =========================================================
   バランス：よろける・こける
   ・月では体が軽くふんばりがきかないので、石につまずくとこける
   ・地球では石につまずいてもよろけるだけ
   ・クレーターの急な坂を速く歩くとよろける
   ・坂や石の上に着地するとこける
   ・たおれる速さも重力で変わる（月ではゆっくりたおれる）
   ========================================================= */
function startWobble(){
  if (player.state !== 'normal') return;
  player.state = 'wobble'; player.st = 1.1; player.cool = 2.5;
  sfx.trip();
  if (S.mode === 'moon') radioOnce('wobbleMoon', 'おっと！ 月では 体が かるくて、ふんばりが きかないね。', 5);
  else radioOnce('wobbleEarth', 'つまずいたね。地球では ふんばれるから、こけずに すんだ！', 5);
}
function startFall(){
  if (player.state === 'fall' || player.state === 'down' || player.state === 'getup') return;
  player.state = 'fall'; player.tilt = 0.12; player.tiltV = 0.5; player.cool = 3;
  S.rec.falls++;
  if (S.mode === 'moon') radioOnce('fallMoon', 'だいじょうぶ？ 月では ゆっくり たおれるね。重力が 小さいからだよ。', 6);
}
function updateBalance(dt){
  player.cool = Math.max(0, player.cool - dt);
  const g = G[S.mode];
  switch (player.state){
    case 'wobble':
      player.st -= dt; if (player.st <= 0) player.state = 'normal'; break;
    case 'fall':
      // たおれる動き（倒立振子）：重力が小さいとゆっくりたおれる
      player.tiltV += (g/1.1) * Math.sin(player.tilt) * dt;
      player.tilt += player.tiltV * dt;
      if (player.tilt >= 1.35){ player.tilt = 1.35; player.state = 'down'; player.st = 1.2; sfx.thud(); }
      break;
    case 'down':
      player.st -= dt; if (player.st <= 0){ player.state = 'getup'; player.st = 0.9; } break;
    case 'getup':
      player.st -= dt; player.tilt = 1.35 * Math.max(0, player.st/0.9);
      if (player.st <= 0){ player.state = 'normal'; player.tilt = 0; player.cool = 1.5; }
      break;
  }
  if (player.state !== 'normal' || player.cool > 0 || !player.grounded) return;
  const sp = Math.hypot(player.vx, player.vz);
  if (sp < 0.6) return;
  // 小さな石につまずく
  for (const t of tripRocks){
    if (Math.hypot(player.x - t.x, player.z - t.z) < t.r + 0.25){
      if (S.mode === 'moon') startFall(); else startWobble();
      return;
    }
  }
  // クレーターの急な坂
  if (sp > 1.2 && slopeAt(player.x, player.z).m > 0.42) startWobble();
}

/* =========================================================
   プレイヤーの更新
   ========================================================= */
function updatePlayer(dt){
  const k = input.keys;
  let ix = input.jx + ((k.KeyD||k.ArrowRight)?1:0) - ((k.KeyA||k.ArrowLeft)?1:0);
  let iy = input.jy + ((k.KeyS||k.ArrowDown)?1:0) - ((k.KeyW||k.ArrowUp)?1:0);
  const il = Math.hypot(ix, iy); if (il > 1){ ix /= il; iy /= il; }
  const canMove = player.state === 'normal' || player.state === 'wobble';
  if (!canMove){ ix = iy = 0; }
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
  const rx = Math.cos(cam.yaw),  rz = -Math.sin(cam.yaw);
  const mx = fx*(-iy) + rx*ix, mz = fz*(-iy) + rz*ix;
  const mlen = Math.hypot(mx, mz);
  if (mlen > 0.08){
    const target = Math.atan2(mx, mz);
    let d = target - player.facing; d = Math.atan2(Math.sin(d), Math.cos(d));
    const rate = player.grounded ? TURN.ground : TURN.air;
    player.facing += d * Math.min(1, rate*dt);
  }
  const speedMul = player.state === 'wobble' ? 0.35 : 1;
  if (canMove && player.grounded){          // 空中では足で地面をけれないので、進む向きは変わらない
    const acc = 10;
    const a = Math.min(1, acc*dt);
    player.vx += (mx*WALK[S.mode]*speedMul - player.vx) * a;
    player.vz += (mz*WALK[S.mode]*speedMul - player.vz) * a;
  } else if (player.grounded){
    const f = Math.exp(-3*dt); player.vx *= f; player.vz *= f;
  }

  // 横の移動と岩の当たり判定
  player.x += player.vx*dt; player.z += player.vz*dt;
  for (const c of colliders){
    const dx = player.x - c.x, dz = player.z - c.z, d = Math.hypot(dx, dz), minD = c.r + PR;
    if (d < minD && player.y < c.h - 0.05){
      if (player.grounded && c.h - player.y <= 0.35 && d < c.r){ player.y = c.h; }
      else if (d > 0.0001){ player.x = c.x + dx/d*minD; player.z = c.z + dz/d*minD; }
    }
  }
  player.x = Math.max(-AREA, Math.min(AREA, player.x));
  player.z = Math.max(-AREA, Math.min(AREA, player.z));

  // ジャンプ
  if (input.jumpQueued && player.grounded && player.state === 'normal'){
    player.vy = V0; player.grounded = false;
    player.jump = { startY: player.y, maxY: player.y, t0: S.elapsed, mode: S.mode, mixed: false };
    sfx.jump();
  }
  input.jumpQueued = false;

  // たての動き（重力）
  const g = G[S.mode], prevY = player.y;
  if (!player.grounded){
    player.y += player.vy*dt - 0.5*g*dt*dt;
    player.vy -= g*dt;
    if (player.jump) player.jump.maxY = Math.max(player.jump.maxY, player.y);
  }
  const fl = floorAt(player.x, player.z, Math.max(prevY, player.y));
  if (player.grounded){
    if (fl < player.y - 0.35){ player.grounded = false; player.vy = 0; player.jump = null; }  // 岩から落ちる
    else player.y = fl;                                                                         // 坂にそって歩く
  } else if (player.y <= fl && player.vy <= 0){
    player.y = fl; player.vy = 0; player.grounded = true;
    onLand();
  }

  updateBalance(dt);

  // 歩くアニメーション・足あと・足音
  const sp = Math.hypot(player.vx, player.vz);
  player.moveAmt = Math.min(1, sp / WALK[S.mode]);
  if (player.grounded && canMove && player.moveAmt > 0.1){
    player.phase += dt * player.moveAmt * (S.mode === 'moon' ? 3.4 : 10.5);
    const st = Math.floor(player.phase / Math.PI);
    if (st !== player.stride){
      player.stride = st;
      if (S.mode === 'moon'){
        const side = (st % 2) ? 1 : -1;
        const fx2 = player.x + Math.cos(player.facing)*0.16*side, fz2 = player.z - Math.sin(player.facing)*0.16*side;
        addFootprint(fx2, floorAt(fx2, fz2, player.y + 0.1), fz2, player.facing);
      } else sfx.step();
    }
  }
  poseRig();
}
function onLand(){
  const j = player.jump; player.jump = null;
  sfx.land();
  if (S.mode === 'moon'){
    for (const side of [-1, 1]){
      const fx2 = player.x + Math.cos(player.facing)*0.16*side, fz2 = player.z - Math.sin(player.facing)*0.16*side;
      addFootprint(fx2, floorAt(fx2, fz2, player.y + 0.1), fz2, player.facing);
    }
  }
  // 坂や石の上に着地するとこける
  const onRockTop = colliders.some(c => Math.abs(player.y - c.h) < 0.05 && Math.hypot(player.x-c.x, player.z-c.z) < c.r);
  if (!onRockTop){
    if (slopeAt(player.x, player.z).m > 0.3 || tripRocks.some(t => Math.hypot(player.x-t.x, player.z-t.z) < t.r + 0.35)){
      startFall(); return;
    }
  }
  if (j && !j.mixed && j.mode === S.mode && Math.abs(player.y - j.startY) < 0.15){
    onJumpMeasured(j.maxY - j.startY, S.elapsed - j.t0, S.mode);
  }
  if (j && S.mission === 1){
    S.sameModeJumps++;
    const m = S.mode, o = m === 'moon' ? 'earth' : 'moon';
    if (S.sameModeJumps >= 3 && !S.rec.jump[o]){
      S.sameModeJumps = -99;   // 案内中は数えない
      later(3, () => {
        if (S.mission !== 1 || S.mode !== m) { S.sameModeJumps = 0; return; }
        radio(`こんどは ${other(m)}で とんでみよう。${other(m)}に きりかえるよ！`, 6);
        setMode(o);
      });
    }
  }
}
function poseRig(){
  const r = rigs[S.mode], t = S.elapsed; let bob = 0;
  r.armL.rotation.z = r.armR.rotation.z = 0;
  tiltGroup.rotation.z = 0;
  if (player.state === 'fall' || player.state === 'down' || player.state === 'getup'){
    r.legL.rotation.x = r.legR.rotation.x = 0;
    r.armL.rotation.x = r.armR.rotation.x = -1.6;   // 手をついてたおれる
  } else if (!player.grounded){
    r.legL.rotation.x = -0.5; r.legR.rotation.x = 0.3;
    r.armL.rotation.x = r.armR.rotation.x = -0.4;
    r.armL.rotation.z = 0.5; r.armR.rotation.z = -0.5;
  } else {
    // もっさり歩き：歩はばは小さめ、体を左右にゆらし、上下にはずむ
    const heavy = S.mode === 'moon';
    const s = Math.sin(player.phase) * (heavy ? 0.42 : 0.75) * player.moveAmt;
    r.legL.rotation.x = s; r.legR.rotation.x = -s;
    r.armL.rotation.x = -s*(heavy ? 0.5 : 1.1); r.armR.rotation.x = s*(heavy ? 0.5 : 1.1);
    r.armL.rotation.z = heavy ? 0.25 : 0; r.armR.rotation.z = heavy ? -0.25 : 0;
    tiltGroup.rotation.z = Math.sin(player.phase) * (heavy ? 0.09 : 0.03) * player.moveAmt;
    bob = Math.abs(Math.sin(player.phase)) * (heavy ? 0.07 : 0.06) * player.moveAmt;
  }
  if (player.state === 'wobble'){
    const k = player.st / 1.1;
    tiltGroup.rotation.z = Math.sin(t*11) * 0.22 * k;
    r.armL.rotation.z = 1.0 + Math.sin(t*14)*0.5; r.armR.rotation.z = -1.0 - Math.sin(t*14+1)*0.5;
  }
  tiltGroup.rotation.x = player.tilt;
  playerGroup.position.set(player.x, player.y + bob, player.z);
  playerGroup.rotation.y = player.facing;
}

function updateCamera(dt){
  const want = new THREE.Vector3(player.x, player.y + 1.2, player.z);
  cam.target.lerp(want, 1 - Math.exp(-8*dt));
  const cp = Math.cos(cam.pitch);
  const cx = cam.target.x + Math.sin(cam.yaw)*cp*cam.dist, cz = cam.target.z + Math.cos(cam.yaw)*cp*cam.dist;
  camera.position.set(cx, Math.max(groundH(cx, cz) + 0.5, cam.target.y + Math.sin(cam.pitch)*cam.dist), cz);
  camera.lookAt(cam.target);
  const sd = SUN_DIR[S.mode];
  sun.position.set(player.x + sd.x*60, player.y + sd.y*60, player.z + sd.z*60);
  sun.target.position.set(player.x, player.y, player.z);
}

/* =========================================================
   リセット
   ========================================================= */
function resetGame(){
  S.runId++; timers = [];
  S.mission = 1; S.elapsed = 0; S.started = false; S.timeLeft = TIME_LIMIT; S.warned = false; S.result = null;
  S.rec = { jump:{ earth:null, moon:null }, stones:0, falls:0, clearTime:null };
  S.said = {}; S.sameModeJumps = 0;
  Object.assign(player, { x:0, y:0, z:3, vx:0, vz:0, vy:0, grounded:true, facing:Math.PI, jump:null, phase:0, stride:0, moveAmt:0,
    state:'normal', st:0, tilt:0, tiltV:0, cool:0 });
  cam.yaw = 0; cam.pitch = 0.32; cam.target.set(0, 1.2, 3);
  fpIndex = 0; footprints.count = 0;
  const spots = pickStoneSpots();
  stones.forEach((s, i) => { s.collected = false; s.g.visible = false; s.spot = spots[i]; });
  baseBeam.visible = false;
  radioEl.style.display = 'none'; toastEl.style.display = 'none';
  setMode('moon'); renderMission(); renderTimer(); poseRig();
}

/* =========================================================
   ゲームループ（dtは1/30秒でクランプ）
   ========================================================= */
const clock = new THREE.Clock();
function loop(){
  const dt = Math.min(clock.getDelta(), 1/30);
  S.dtScale = dt * 60;
  S.renderFrames++;
  if (!S.paused){
    S.frames++; S.elapsed += dt;
    const now = S.elapsed;
    const due = timers.filter(t => t.t <= now && t.id === S.runId);
    timers = timers.filter(t => t.t > now && t.id === S.runId);
    due.forEach(t => t.fn());
    if (!S.paused){
      updateTimer(dt);
      updatePlayer(dt);
      updateStones();
      const spin = S.elapsed * 2;
      stones.forEach(s => { s.ring.rotation.y = spin; s.ring.position.y = 1.1 + Math.sin(spin)*0.15; });
    }
  }
  updateCamera(dt);
  renderer.render(scene, camera);
}

/* =========================================================
   テスト用フック
   プレイヤーは player.x/y/z/vy/state/tilt（内部データ）で動かし、
   メッシュは毎フレーム poseRig() で反映する。地面の高さは groundH(x,z)。
   ========================================================= */
window.__G = {
  S, player, camera, stones, colliders, craters, tripRocks,
  get frames(){ return S.frames; },
  get elapsed(){ return S.elapsed; },
  api: {
    setMode, jump(){ input.jumpQueued = true; },
    setInput(x, y){ input.jx = x; input.jy = y; },
    teleport(x, y, z){ Object.assign(player, { x, y, z, vx:0, vz:0, vy:0, grounded:false }); },
    fall: startFall, wobble: startWobble, groundH,
    setTime(s){ S.timeLeft = s; },
    reset: resetGame, showResult
  }
};

resetGame();
showIntro(false);
renderer.setAnimationLoop(loop);
</script>
